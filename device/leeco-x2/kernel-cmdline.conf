# Kernel command line for LeEco Le Max 2 (x2)
#
# NOTE: deviceinfo_kernel_cmdline is deprecated in pmaports (pmaports!7708),
# this file replaces it.
#
# The stock bootloader passes androidboot.veritymode=enforcing even though
# this device has no AVB and no vbmeta partition. Explicitly disabling
# verity/verification here avoids the kernel trying to set up dm-verity.
#
# mdss_mdp.panel= is intentionally NOT carried over from the Android
# cmdline: upstream DRM picks the panel via the DTS compatible string.

PMOS_NO_OUTPUT_REDIRECT