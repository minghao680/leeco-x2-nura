name: Build kernel + DTB

# Compiles the mainline msm8996 kernel with the Le Max 2 DTS patched in and
# uploads Image.gz + the x2 dtb. Local RAM (15.7 GB, ~2 GB free) is not
# enough for a kernel build, so everything happens here.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "msm8996-mainline/linux ref (tag/branch)"
        required: true
        default: "v6.19.5-msm8996"
      defconfig:
        description: "defconfig to use"
        required: true
        default: "defconfig"
  push:
    paths:
      - "kernel/**"
      - ".github/workflows/kernel.yml"

env:
  KERNEL_REPO: https://gitlab.com/msm8996-mainline/linux.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout port repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/graalvm /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "=== after ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            device-tree-compiler lz4 zstd \
            clang lld llvm make gcc-aarch64-linux-gnu
          clang --version | head -1
          dtc --version

      - name: Clone kernel
        env:
          REF: ${{ github.event.inputs.kernel_ref || 'v6.19.5-msm8996' }}
        run: |
          git clone --depth 1 --branch "$REF" "$KERNEL_REPO" kernel-src
          cd kernel-src
          echo "KERNEL_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log --oneline -1

      - name: Apply Le Max 2 patches
        run: |
          set -e
          DTS=kernel-src/arch/arm64/boot/dts/qcom/msm8996-leeco-x2.dts
          cp kernel/patches/0001-arm64-dts-qcom-add-LeEco-Le-Max-2.dts "$DTS"

          # Register the dtb in the Makefile.
          # Each dtb gets its own "dtb-$(CONFIG_ARCH_QCOM)\t+= foo.dtb" line,
          # tab-indented. Append right after the oneplus3 line so the 8996
          # group stays together.
          MF=kernel-src/arch/arm64/boot/dts/qcom/Makefile
          if ! grep -q "msm8996-leeco-x2" "$MF"; then
            awk '
              { print }
              /msm8996-oneplus3\.dtb/ && !done {
                printf "dtb-$(CONFIG_ARCH_QCOM)\t+= msm8996-leeco-x2.dtb\n"
                done = 1
              }
            ' "$MF" > "$MF.new" && mv "$MF.new" "$MF"
          fi

          echo "=== Makefile entry ==="
          grep -n "leeco-x2" "$MF" || {
            echo "::error::failed to register dtb in Makefile"
            grep -n "msm8996-oneplus3" "$MF" || echo "oneplus3 line not found either"
            exit 1
          }

      - name: Configure
        run: |
          set -e
          cd kernel-src
          make ARCH=arm64 LLVM=1 "${{ github.event.inputs.defconfig || 'defconfig' }}"

          # Ensure required options are on
          for opt in \
            CONFIG_ARCH_QCOM \
            CONFIG_DRM_MSM \
            CONFIG_SCSI_UFS_QCOM \
            CONFIG_PHY_QCOM_QMP_UFS \
            CONFIG_TOUCHSCREEN_ATMEL_MXT \
            CONFIG_PINCTRL_MSM8996 \
            CONFIG_QCOM_TSENS \
            CONFIG_ATH10K_PCI \
          ; do
            scripts/config --file .config -e "${opt#CONFIG_}"
          done
          make ARCH=arm64 LLVM=1 olddefconfig

          echo "=== key options ==="
          grep -E "CONFIG_(ARCH_QCOM|DRM_MSM|SCSI_UFS_QCOM|PHY_QCOM_QMP_UFS|TOUCHSCREEN_ATMEL_MXT|PINCTRL_MSM8996)=" .config || true

      - name: Build kernel + dtbs
        run: |
          set -eo pipefail
          cd kernel-src
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image.gz modules dtbs 2>&1 | tail -60

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          cp kernel-src/arch/arm64/boot/Image.gz out/
          cp kernel-src/arch/arm64/boot/dts/qcom/msm8996-leeco-x2.dtb out/ 2>/dev/null || {
            echo "::error::dtb not built"
            ls kernel-src/arch/arm64/boot/dts/qcom/*.dtb | head
            exit 1
          }
          # Sanity-check the dtb carries our board ids
          dtc -I dtb -O dts out/msm8996-leeco-x2.dtb 2>/dev/null \
            | grep -E "qcom,(msm-id|board-id)" | head -4

          {
            echo "kernel_rev=$KERNEL_REV"
            echo "kernel_ref=${{ github.event.inputs.kernel_ref || 'v6.19.5-msm8996' }}"
            echo "built_at=$(date -u +%FT%TZ)"
          } > out/BUILD-INFO

          (cd out && sha256sum Image.gz msm8996-leeco-x2.dtb > SHA256SUMS)
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x2-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kernel build"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| kernel ref | \`${{ github.event.inputs.kernel_ref || 'v6.19.5-msm8996' }}\` |"
            echo "| rev | \`${KERNEL_REV:-n/a}\` |"
            echo "| status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
