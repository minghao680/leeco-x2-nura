name: Build lk2nd probe payload

# Builds payload/probe.S into a raw arm64 binary and wraps it in a boot.img
# (with our dtb built fresh from source and appended inside the kernel blob,
# because lk2nd requires an in-blob DTB to accept an image).
# The payload is booted by lk2nd exactly like a real kernel: it records the
# DTB pointer + first 4 KiB of the passed (patched) DTB into the stock
# kernel's ramoops console buffer, then resets via PSCI. Read the result on
# Android at /sys/fs/pstore/console-ramoops.

on:
  workflow_dispatch:
  push:
    paths:
      - "payload/**"
      - "kernel/**"
      - ".github/workflows/payload.yml"

env:
  KERNEL_REPO: https://gitlab.com/msm8996-mainline/linux.git
  KERNEL_REF: v6.19.5-msm8996

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex python3

      - name: Build x2 dtb from source
        run: |
          set -eo pipefail
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPO" kernel-src
          cp kernel/patches/0001-arm64-dts-qcom-add-LeEco-Le-Max-2.dts \
             kernel-src/arch/arm64/boot/dts/qcom/msm8996-leeco-x2.dts
          MF=kernel-src/arch/arm64/boot/dts/qcom/Makefile
          grep -q "msm8996-leeco-x2" "$MF" || awk '
            { print }
            /msm8996-oneplus3\.dtb/ && !done {
              printf "dtb-$(CONFIG_ARCH_QCOM)\t+= msm8996-leeco-x2.dtb\n"
              done = 1
            }' "$MF" > "$MF.new" && mv "$MF.new" "$MF"
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               qcom/msm8996-leeco-x2.dtb
          cp arch/arm64/boot/dts/qcom/msm8996-leeco-x2.dtb ../
          cd ..
          # verify ramoops node present with 3.18-matched sizes
          sudo apt-get install -y --no-install-recommends device-tree-compiler
          dtc -I dtb -O dts msm8996-leeco-x2.dtb | \
            grep -A6 "ramoops@91500000" || {
            echo "::error::ramoops@91500000 missing from dtb"; exit 1; }

      - name: Assemble payload
        run: |
          set -eo pipefail
          cd payload
          aarch64-linux-gnu-gcc -c probe.S -o probe.o -nostdlib
          aarch64-linux-gnu-objcopy -O binary probe.o probe.bin
          # lk2nd only locates the appended DTB correctly on the gzip path
          # (decompress() returns the dtb offset); raw binaries make the
          # scan start at offset 0 and fail with 'dtb not found'.
          gzip -9c probe.bin > probe.gz
          echo "=== disassembly (verify encodings) ==="
          aarch64-linux-gnu-objdump -d probe.o | tee disasm.txt
          python3 - <<'EOF'
          import gzip
          d = gzip.decompress(open('probe.gz','rb').read())
          assert d[0x38:0x3c] == b'ARM\x64', d[:0x40].hex()
          assert (d[3] & 0xfc) == 0x14, 'first insn must be b, got ' + d[:4].hex()
          print('header OK, size', len(d))
          EOF

      - name: Wrap into boot.img
        run: |
          set -eo pipefail
          python3 scripts/make-bootimg.py payload/probe.gz \
            msm8996-leeco-x2.dtb boot-payload.img
          ls -l boot-payload.img payload/probe.gz
          sha256sum payload/probe.gz boot-payload.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-probe-${{ github.run_number }}
          path: |
            payload/probe.gz
            payload/disasm.txt
            msm8996-leeco-x2.dtb
            boot-payload.img
          if-no-files-found: error
          retention-days: 30
